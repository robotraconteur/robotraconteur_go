name: CI

on:
  push:
  workflow_dispatch:

# The jobs only read the repository; artifacts and caches use the runner's
# own token. Actions are pinned to commit SHAs (version in the comment).
permissions:
  contents: read

env:
  # Robot Raconteur core: 1.3.0 plus the MinGW-w64 support of #497 (needed by
  # the Windows builds; not yet in a release).
  RR_REPO: robotraconteur/robotraconteur
  RR_REF: d8a4b22855bda54d2670038b2dbdc10caea9ba4d

jobs:
  linux:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
          path: robotraconteur_go
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
          repository: ${{ env.RR_REPO }}
          ref: ${{ env.RR_REF }}
          path: robotraconteur
      - name: Restore dev image
        id: image-cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ${{ runner.temp }}/rr-go-dev.tar
          key: rr-go-dev-${{ hashFiles('robotraconteur_go/docker/Dockerfile.dev') }}
      - name: Load or build dev image
        run: |
          if [ -f "${{ runner.temp }}/rr-go-dev.tar" ]; then
            podman load -i "${{ runner.temp }}/rr-go-dev.tar"
          else
            robotraconteur_go/scripts/podman.sh image
            podman save -o "${{ runner.temp }}/rr-go-dev.tar" localhost/rr-go-dev:latest
          fi
      - name: Restore build caches
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ${{ runner.temp }}/rr-go-cache
          key: rr-go-cache-${{ env.RR_REF }}-${{ github.sha }}
          restore-keys: |
            rr-go-cache-${{ env.RR_REF }}-
            rr-go-cache-
      - name: Build
        env:
          RRGO_CACHE_DIR: ${{ runner.temp }}/rr-go-cache
          RR_SRC_DIR: ${{ github.workspace }}/robotraconteur
          JOBS: "2"
          # builds the upstream C++ test server used by the interop tests
          RR_TESTING: "ON"
        run: robotraconteur_go/scripts/podman.sh build
      # The Windows cross build generates Go test packages and C++ test thunks with these
      - name: Strip generators
        run: |
          mkdir -p "${{ runner.temp }}/gen"
          strip -o "${{ runner.temp }}/gen/RobotRaconteurGenGo" robotraconteur_go/build/go/RobotRaconteurGenGo
          strip -o "${{ runner.temp }}/gen/RobotRaconteurGen" robotraconteur_go/build/install/bin/RobotRaconteurGen
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: generators-linux
          path: ${{ runner.temp }}/gen
          retention-days: 1
      - name: Test (no network)
        env:
          RRGO_CACHE_DIR: ${{ runner.temp }}/rr-go-cache
          RR_SRC_DIR: ${{ github.workspace }}/robotraconteur
        run: robotraconteur_go/scripts/podman.sh test
      - name: Check committed SWIG sources are up to date
        env:
          RRGO_CACHE_DIR: ${{ runner.temp }}/rr-go-cache
          RR_SRC_DIR: ${{ github.workspace }}/robotraconteur
        run: |
          robotraconteur_go/scripts/podman.sh shell scripts/regen_swig.sh
          git -C robotraconteur_go diff --exit-code --stat -- robotraconteur native \
            || { echo "::error::committed SWIG sources are out of date: run scripts/regen_swig.sh"; exit 1; }

  # The user build from the README on a plain runner: scripts/build_native.sh,
  # then a separate module that uses the bindings through pkg-config.
  linux-user-build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
          path: robotraconteur_go
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version: "1.27"
      - name: apt
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends build-essential cmake ninja-build pkg-config \
            libboost-all-dev libssl-dev libdbus-1-dev libbluetooth-dev libusb-1.0-0-dev
      - name: Build and install the native libraries
        # No RR_SRC: the script fetches its default core commit, as for a user
        env:
          JOBS: "4"
        run: |
          grep -q "RR_GIT_REF:-${{ env.RR_REF }}" robotraconteur_go/scripts/build_native.sh \
            || { echo "::error::build_native.sh default core differs from RR_REF"; exit 1; }
          robotraconteur_go/scripts/build_native.sh "$HOME/rrgo"
      - name: Build and test a module that uses the bindings
        run: |
          export PKG_CONFIG_PATH=$HOME/rrgo/lib/pkgconfig PATH=$HOME/rrgo/bin:$PATH
          pkg-config --libs robotraconteur-go
          # replace: test this commit of the module, not a published version
          mkdir user && cp -r robotraconteur_go/examples/reynard_the_robot/. user/
          cd user
          rm -rf gen
          cat > go.mod <<EOF
          module example.com/reynard
          go 1.27
          require github.com/robotraconteur/robotraconteur_go v0.1.1
          replace github.com/robotraconteur/robotraconteur_go => ../robotraconteur_go
          EOF
          sed -i 's#github.com/robotraconteur/robotraconteur_go/examples/reynard_the_robot#example.com/reynard#g' \
            $(grep -rl "examples/reynard_the_robot" . )
          go generate ./...
          go vet ./...
          go test -count=1 ./...

  # The Windows user build from the README: MSYS2 MINGW64, scripts/build_native.sh,
  # then a separate module and the repository's own tests, all built natively.
  windows-user-build:
    runs-on: windows-2022
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
          path: robotraconteur_go
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
          repository: ${{ env.RR_REPO }}
          ref: ${{ env.RR_REF }}
          path: robotraconteur
      - uses: msys2/setup-msys2@3c51bf698df1e37b2261f53cb67797b97761185c # v2.34.0
        with:
          msystem: MINGW64
          update: true
          install: >-
            git
            mingw-w64-x86_64-gcc
            mingw-w64-x86_64-cmake
            mingw-w64-x86_64-ninja
            mingw-w64-x86_64-pkgconf
            mingw-w64-x86_64-boost
            mingw-w64-x86_64-go
      - name: Build and install the native libraries
        run: |
          go version
          RR_SRC=$(cygpath -u "$GITHUB_WORKSPACE")/robotraconteur JOBS=4 \
            robotraconteur_go/scripts/build_native.sh "$HOME/rrgo"
      - name: Build and test a module that uses the bindings
        run: |
          export PKG_CONFIG_PATH=$HOME/rrgo/lib/pkgconfig PATH=$HOME/rrgo/bin:$PATH
          pkg-config --libs robotraconteur-go
          # replace: test this commit of the module, not a published version
          mkdir user && cp -r robotraconteur_go/examples/reynard_the_robot/. user/
          cd user
          rm -rf gen
          cat > go.mod <<EOF
          module example.com/reynard
          go 1.27
          require github.com/robotraconteur/robotraconteur_go v0.1.1
          replace github.com/robotraconteur/robotraconteur_go => ../robotraconteur_go
          EOF
          sed -i 's#github.com/robotraconteur/robotraconteur_go/examples/reynard_the_robot#example.com/reynard#g' \
            $(grep -rl "examples/reynard_the_robot" . )
          go generate ./...
          go vet ./...
          go test -count=1 ./...
      - name: Repository tests (native)
        run: |
          export PKG_CONFIG_PATH=$HOME/rrgo/lib/pkgconfig PATH=$HOME/rrgo/bin:$PATH
          cd robotraconteur_go
          mkdir -p test/gen
          RobotRaconteurGenGo --go-import-prefix=github.com/robotraconteur/robotraconteur_go/test/gen \
            -I ../robotraconteur/test/robdef --output-dir test/gen \
            com.robotraconteur.testing.TestService1.robdef com.robotraconteur.testing.TestService2.robdef \
            com.robotraconteur.testing.TestService3.robdef com.robotraconteur.testing.TestService4.robdef \
            com.robotraconteur.testing.TestService5.robdef
          RobotRaconteurGenGo --go-import-prefix=github.com/robotraconteur/robotraconteur_go/test/gen \
            --output-dir test/gen test/robdef/experimental.gen_test_go_names.robdef
          gofmt -w test/gen
          cp ../robotraconteur/test/data/test_vectors.bin test/testvectors/
          go vet -unsafeptr=false ./robotraconteur/... ./test/...
          go test -count=1 -timeout 600s ./robotraconteur/... ./test/loopback ./test/manualnode ./test/gennames

  # Windows: core and Go bindings cross-built with MinGW-w64 in podman (static,
  # no MinGW DLLs needed), test binaries run on a Windows runner.
  windows-build:
    runs-on: ubuntu-24.04
    needs: linux
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
          path: robotraconteur_go
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
          repository: ${{ env.RR_REPO }}
          ref: ${{ env.RR_REF }}
          path: robotraconteur
      - name: Restore MinGW image
        id: image-cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ${{ runner.temp }}/rr-go-mingw.tar
          key: rr-go-mingw-${{ hashFiles('robotraconteur_go/docker/*') }}
      - name: Load or build MinGW image
        run: |
          if [ -f "${{ runner.temp }}/rr-go-mingw.tar" ]; then
            podman load -i "${{ runner.temp }}/rr-go-mingw.tar"
          else
            robotraconteur_go/scripts/podman.sh mingw-image
            podman save -o "${{ runner.temp }}/rr-go-mingw.tar" localhost/rr-go-mingw:latest
          fi
      - name: Restore build caches
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ${{ runner.temp }}/rr-go-mingw-cache
          key: rr-go-mingw-cache-${{ env.RR_REF }}-${{ github.sha }}
          restore-keys: |
            rr-go-mingw-cache-${{ env.RR_REF }}-
            rr-go-mingw-cache-
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: generators-linux
          path: ${{ runner.temp }}/gen
      - name: Install Linux generators
        run: |
          mkdir -p robotraconteur_go/build/go robotraconteur_go/build/install/bin
          install -m 755 "${{ runner.temp }}/gen/RobotRaconteurGenGo" robotraconteur_go/build/go/
          install -m 755 "${{ runner.temp }}/gen/RobotRaconteurGen" robotraconteur_go/build/install/bin/
      - name: Cross-build core, C++ test programs and Go native library
        env:
          RRGO_CACHE_DIR: ${{ runner.temp }}/rr-go-mingw-cache
          RR_SRC_DIR: ${{ github.workspace }}/robotraconteur
          JOBS: "2"
          # the upstream C++ test server and clients for the interop/crosscheck tests
          RR_TESTING: "ON"
        run: robotraconteur_go/scripts/podman.sh mingw-build
      - name: Cross-compile Go tests and examples (includes go vet)
        env:
          RRGO_CACHE_DIR: ${{ runner.temp }}/rr-go-mingw-cache
          RR_SRC_DIR: ${{ github.workspace }}/robotraconteur
        run: robotraconteur_go/scripts/podman.sh mingw-tests
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: windows-tests
          path: robotraconteur_go/build-mingw/tests
          retention-days: 3

  windows-test:
    runs-on: windows-2022
    needs: windows-build
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
          path: robotraconteur_go
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: windows-tests
          path: robotraconteur_go/build-mingw/tests
      - name: Check native dependencies (system DLLs only)
        shell: bash
        working-directory: robotraconteur_go
        run: |
          objdump -p build-mingw/tests/test_loopback.test.exe | grep "DLL Name" || true
      # includes the examples (examples/reynard_the_robot/client test), and
      # interop/crosscheck with the C++ test programs from build-mingw/tests/cpp
      - name: Test (loopback, intra and local transports only)
        shell: bash
        working-directory: robotraconteur_go
        run: scripts/run_windows_tests.sh
